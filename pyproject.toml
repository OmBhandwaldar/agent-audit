[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentaudit"
version = "0.1.0"
description = "AgentAudit SDK — make any AI agent's decisions independently verifiable on Algorand."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AgentAudit" }]
keywords = ["ai-agents", "audit", "compliance", "algorand", "verifiable"]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
# Pay-per-call billing (x402). Only needed when constructing AuditClient with x402_mnemonic.
x402 = [
    "x402-avm>=2.0",
    "py-algorand-sdk>=2.0",
]

[project.urls]
Homepage = "https://github.com/OmBhandwaldar/agent-audit"

# Ship only the SDK package — not the backend (sdk/, api/, tenancy/, contracts/, ...).
[tool.setuptools]
packages = ["agentaudit"]
